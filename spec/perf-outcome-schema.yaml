$schema: https://json-schema.org/draft/2020-12/schema
$id: https://compforge.dev/schemas/perf-outcome-schema.yaml
title: Perf Harness Outcome JSONL Record
type: object
required: [trial, t, case_id, status, duration_ms, ok, error_kind, events, nbytes, dropped,
           facets, metrics, meta]
properties:
  trial: {type: string, minLength: 1, description: arm_id / Trial 对齐键}
  t: {type: number, minimum: 0, description: dispatch 时刻相对 Trial 起点的秒数}
  case_id: {type: string}
  status: {type: [integer, 'null']}
  duration_ms: {type: number, minimum: 0}
  ok: {type: boolean}
  error_kind: {type: [string, 'null']}
  events: {type: integer, minimum: 0}
  nbytes: {type: integer, minimum: 0}
  dropped: {type: boolean}
  facets:
    type: object
    additionalProperties: {type: string}
  metrics:
    type: object
    additionalProperties: {type: number}
  meta:
    type: object
    description: 协议事实与 trace_id/message_id 等跨平面对齐键
additionalProperties: true
