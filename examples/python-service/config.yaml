service:
  name: control-server
  component:
    repository: { forge: github, path: example/control }
    name: control-server
  environment: { name: local }
  base_url: ${CONTROL_BASE_URL:-http://localhost:8080}
  headers:
    Authorization: Bearer ${CONTROL_TOKEN}

runtime:
  http_timeout_s: 30

profile: ${E2E_PROFILE:-full}

custom:
  bot_prefix: ${E2E_BOT_PREFIX:-e2e-bot-}
