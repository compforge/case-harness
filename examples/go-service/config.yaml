service:
  name: sandbox-server
  component:
    repository: { forge: github, path: example/sandbox }
    name: sandbox-server
  environment: { name: local }
  base_url: ${EXAMPLE_BASE_URL:-http://localhost:8090}
  headers:
    Authorization: Bearer ${EXAMPLE_TOKEN}

runtime:
  http_timeout_s: 120
  poll_interval_ms: 500
  poll_timeout_s: 60

profile: ${EXAMPLE_ENV_PROFILE:-full}

custom:
  ttl_seconds: ${EXAMPLE_TTL_SEC:-60}
  pvc_ttl_seconds: ${EXAMPLE_PVCTTL_SEC:-120}
  conv_prefix: ${EXAMPLE_CONV_PREFIX:-e2e-}
