[project]
name = "case-harness"
version = "0.1.0"
description = "Cross-language test harnesses (e2e/eval/perf/trace): cases in, verdicts out"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# corpus 三表的 parquet 持久化（机器查询面）；缺则 store 回退 jsonl，核心算子不受影响
trace-corpus = [
    "pyarrow>=14,<22",
]

[project.scripts]
e2e = "e2e_harness.cli:main"
casegen = "e2e_harness.casegen:main"
trace = "trace_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["e2e_harness", "eval_harness", "perf_harness", "trace_harness", "harness_common"]
exclude = ["**/tests"]

# The internal publish pipeline builds via `python setup.py sdist` (setuptools),
# whose flat-layout auto-discovery refuses >1 top-level package. List them
# explicitly so the sdist ships all packages (tests excluded). `harness_common` holds the
# harness-neutral shared code (report_kit IR + renderer, verdict schema) the 3 SDKs
# depend on without importing each other.
[tool.setuptools.packages.find]
include = ["e2e_harness*", "eval_harness*", "perf_harness*", "trace_harness*", "harness_common*"]
exclude = ["*.tests", "*.tests.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# tests live INSIDE each package (tests follow their owner); `pytest` with no args runs all
testpaths = [
    "harness_common/tests",
    "e2e_harness/tests",
    "eval_harness/tests",
    "perf_harness/tests",
    "trace_harness/tests",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "setuptools>=82.0.1",
]
